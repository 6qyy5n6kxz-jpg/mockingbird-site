name: Public content tests
on: [push, pull_request]
jobs:
  public-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/public-events.test.cjs
      - run: node --test tests/public-specials.test.cjs
      - run: node --check js/main.js
      - run: node --check js/public-events.js
      - run: node --check js/public-specials.js
